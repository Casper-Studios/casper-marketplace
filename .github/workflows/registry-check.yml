name: Registry Check

# Runs the registry-sync unit tests and verifies telemetry/casper-skills.json is
# current on every pull request. The Notion sync itself is not enabled here yet.

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'Casper-Studios/casper-marketplace'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: .github/scripts/registry-sync/sync.py.lock

      - name: Unit tests
        run: uv run --locked --script .github/scripts/registry-sync/sync.py test

      - name: telemetry/casper-skills.json is current
        env:
          GH_REPO: ${{ github.repository }}
        run: uv run --locked --script .github/scripts/registry-sync/sync.py export --check
